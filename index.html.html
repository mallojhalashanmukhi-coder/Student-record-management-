<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Record Management System – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#3949ab;--primary-dark:#283593;--primary-light:#c5cae9;--primary-bg:#e8eaf6;--card-bg:#ffffff;--body-bg:#f0f2f8;--text:#2d3142;--text-muted:#7c7f94;--border:#e0e3f0;--input-bg:#fafbff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:var(--body-bg);color:var(--text);}

/* PAGE */
.page{min-height:100vh;background:linear-gradient(135deg,var(--primary-bg) 0%,#dfe3f8 100%);display:flex;align-items:center;justify-content:center;padding:20px;}

/* CARD */
.login-card{display:flex;width:860px;min-height:480px;background:var(--card-bg);border-radius:22px;box-shadow:0 10px 50px rgba(57,73,171,0.15);overflow:hidden;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* LEFT ILLUSTRATION */
.login-left{flex:1.1;background:linear-gradient(160deg,var(--primary-bg),var(--primary-light));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 20px 0;position:relative;overflow:hidden;}
.login-left::before{content:'';position:absolute;top:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);}
.login-left::after{content:'';position:absolute;bottom:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);}
.login-left svg{max-width:240px;width:100%;position:relative;z-index:1;}
.brand-label{position:absolute;top:24px;left:0;right:0;text-align:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:1rem;color:var(--primary);opacity:.8;letter-spacing:.5px;}

/* RIGHT FORM */
.login-right{flex:1;padding:52px 44px;display:flex;flex-direction:column;justify-content:center;}
.login-right h2{color:var(--primary);font-size:1.75rem;font-weight:800;text-align:center;margin-bottom:4px;font-family:'Poppins',sans-serif;}
.login-subtitle{color:var(--text-muted);font-size:0.82rem;text-align:center;margin-bottom:28px;}

/* INPUTS */
.inp-wrap{position:relative;margin-bottom:14px;}
.inp-wrap input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:0.88rem;font-family:'Nunito',sans-serif;color:var(--text);background:var(--input-bg);outline:none;transition:border .2s,box-shadow .2s;}
.inp-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);}
.inp-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.95rem;}

/* ERROR */
.error-msg{color:#c62828;font-size:.78rem;font-weight:700;margin-bottom:10px;display:none;background:#ffebee;padding:8px 12px;border-radius:8px;border:1px solid #ffcdd2;}
.error-msg.show{display:block;}

.trouble{font-size:.78rem;color:var(--primary);text-align:right;display:block;margin-bottom:18px;cursor:pointer;font-weight:600;text-decoration:none;}
.trouble:hover{text-decoration:underline;}

/* BUTTON */
.btn-login{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:.96rem;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;transition:background .2s,transform .1s,box-shadow .2s;margin-bottom:18px;letter-spacing:.2px;}
.btn-login:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 6px 18px rgba(57,73,171,.3);}
.btn-login:active{transform:translateY(0);}

/* OR DIVIDER */
.or-sep{text-align:center;font-size:.8rem;color:var(--text-muted);margin-bottom:14px;position:relative;}
.or-sep::before,.or-sep::after{content:'';position:absolute;top:50%;width:36%;height:1px;background:var(--border);}
.or-sep::before{left:0;}.or-sep::after{right:0;}

/* SOCIAL */
.social-row{display:flex;gap:10px;margin-bottom:18px;}
.social-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:var(--input-bg);font-size:.84rem;font-family:'Nunito',sans-serif;cursor:pointer;color:var(--text);transition:border .2s,background .2s,transform .1s;}
.social-btn:hover{border-color:var(--primary);background:var(--primary-bg);transform:translateY(-1px);}

.signup-txt{text-align:center;font-size:.8rem;color:var(--text-muted);}
.signup-txt a{color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none;}
.signup-txt a:hover{text-decoration:underline;}

/* DEMO HINT */
.demo-hint{margin-top:18px;text-align:center;font-size:.75rem;color:var(--text-muted);background:var(--primary-bg);border-radius:8px;padding:8px 12px;}
.demo-hint strong{color:var(--primary);}

/* RESPONSIVE */
@media(max-width:640px){
  .login-left{display:none;}
  .login-card{width:95vw;}
  .login-right{padding:36px 28px;}
}
</style>
</head>
<body>
<div class="page">
  <div class="login-card">

    <!-- LEFT: Illustration -->
    <div class="login-left">
      <div class="brand-label">🎓 Student Record Management</div>
      <svg viewBox="0 0 260 290" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="185" cy="55" r="28" fill="white" stroke="#9fa8da" stroke-width="2"/>
        <line x1="185" y1="40" x2="185" y2="55" stroke="#3949ab" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="185" y1="55" x2="196" y2="63" stroke="#3949ab" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="185" cy="55" r="3" fill="#3949ab"/>
        <path d="M38 82 Q55 70 72 82 Q89 94 106 82" stroke="#9fa8da" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M155 135 Q170 123 185 135 Q200 147 215 135" stroke="#9fa8da" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="68" cy="162" r="5" fill="#9fa8da"/>
        <circle cx="202" cy="100" r="5" fill="#9fa8da"/>
        <circle cx="48" cy="205" r="5" fill="#9fa8da"/>
        <rect x="30" y="245" width="200" height="6" rx="3" fill="#9fa8da"/>
        <rect x="38" y="202" width="32" height="43" rx="4" fill="#7986cb"/>
        <rect x="48" y="196" width="16" height="49" rx="3" fill="#5c6bc0"/>
        <circle cx="130" cy="154" r="22" fill="#fff" stroke="#9fa8da" stroke-width="1.5"/>
        <path d="M109 149 Q118 128 130 126 Q142 128 151 149" fill="#222"/>
        <path d="M107 155 Q105 141 113 136" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="122" cy="157" r="2.2" fill="#444"/>
        <circle cx="138" cy="157" r="2.2" fill="#444"/>
        <path d="M123 167 Q130 173 137 167" stroke="#444" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M110 177 Q115 196 130 201 Q145 196 150 177 Q140 170 130 170 Q120 170 110 177Z" fill="#222"/>
        <rect x="108" y="188" width="44" height="28" rx="3" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
        <rect x="112" y="191" width="36" height="20" rx="2" fill="#c5cae9"/>
        <rect x="104" y="216" width="52" height="4" rx="2" fill="#bdbdbd"/>
        <path d="M115 215 Q112 235 108 246" stroke="#222" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M145 215 Q148 235 152 246" stroke="#222" stroke-width="6" stroke-linecap="round" fill="none"/>
        <ellipse cx="106" cy="248" rx="13" ry="5" fill="#222"/>
        <ellipse cx="154" cy="248" rx="13" ry="5" fill="#222"/>
      </svg>
    </div>

    <!-- RIGHT: Form -->
    <div class="login-right">
      <h2>Student Login</h2>
      <p class="login-subtitle">Hey enter your details to sign in to your account</p>

      <div class="error-msg" id="error-msg">⚠️ Invalid credentials. Please try again.</div>

      <div class="inp-wrap">
        <span class="inp-icon">👤</span>
        <input type="text" id="username" placeholder="Enter your username/email" autocomplete="username">
      </div>
      <div class="inp-wrap">
        <span class="inp-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>

      <a class="trouble" href="#">Having Trouble in sign in?</a>

      <button class="btn-login" onclick="doLogin()">Login In</button>

      <div class="or-sep">Or Sign in with</div>
      <div class="social-row">
        <button class="social-btn" onclick="doLogin()">
          <svg width="15" height="15" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn" onclick="doLogin()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <p class="signup-txt">Don't have an account? <a href="#" onclick="doLogin()">Signup Now</a></p>

      <div class="demo-hint">
        Demo: use any username & password —
        <strong>admin / admin</strong> or just click Login
      </div>
    </div>

  </div>
</div>

<script>
function doLogin(){
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const err  = document.getElementById('error-msg');

  // Accept any non-empty input, or default demo credentials
  if(user === '' && pass === ''){
    // allow blank = demo mode
  }
  err.classList.remove('show');

  // Navigate to dashboard
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
